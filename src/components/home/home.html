<main class="home-container">
  <section class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">DESATA TU LEYENDA</h1>
      <p class="hero-subtitle">Únete a millones de jugadores en el campo de batalla definitivo. Estrategia, reflejos y gloria te esperan.</p>
      <button class="cta-button">JUGAR GRATIS</button>
    </div>
  </section>

  <section class="champions-section" id="champions-section" [ngStyle]="{'transform': 'translateY(' + parallaxOffset() + 'px)'}">
    <div class="section-header">
      <h2 class="section-title">ELIGE TU CAMINO</h2>
      <div class="title-separator"></div>
    </div>
    <div class="champion-grid">
    @for(character of characters; track character.id) {
      <article class="champion-card">
        <div class="card-image assassin-bg">
          <img src="{{character.thumbnailUrl}}">
        </div>
        <div class="card-content">
          <h3>{{character.name}}</h3>
          <p>{{character.title}}</p>
        </div>
      </article>
    }
    </div>
    <br><br>
  </section>
</main>
